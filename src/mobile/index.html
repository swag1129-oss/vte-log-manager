<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f4e79">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="VTE Log">
  <title>VTE Log Manager</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="title">VTE Log</div>
    <div class="sync" id="syncStatus">오프라인 캐시</div>
    <button class="icon-btn" id="syncBtn" hidden aria-label="동기화">⟳</button>
  </header>

  <main>
    <!-- First run -->
    <section class="screen" id="screen-login" hidden>
      <div class="card center">
        <h1>A222 VTE Log Manager</h1>
        <p>랩 공용 Dropbox 계정으로 로그인하면 증착 로그와 calibration을 볼 수 있어요.</p>
        <button class="primary" id="loginBtn">Dropbox 로그인</button>
        <p class="error" id="loginError"></p>
      </div>
    </section>
    <section class="screen" id="screen-author" hidden>
      <form class="card" id="authorForm">
        <h2>작성자 이름</h2>
        <p>이 기기에서 기록할 때 파일에 남을 이름이에요. 설정에서 바꿀 수 있어요.</p>
        <input id="authorInput" autocomplete="name" placeholder="예: 홍길동" required>
        <button class="primary" type="submit">저장</button>
      </form>
    </section>

    <!-- Logs -->
    <section class="screen" id="screen-logs" hidden>
      <div class="filters">
        <input id="logSearch" type="search" placeholder="재료·파일명 검색 (예: CBP)">
        <div class="segmented" id="logType">
          <button data-type="" class="active">전체</button>
          <button data-type="일반증착">일반</button>
          <button data-type="툴링">툴링</button>
        </div>
      </div>
      <div class="card error" id="syncError" hidden></div>
      <div class="count" id="logCount"></div>
      <ul class="list" id="logList"></ul>
    </section>
    <section class="screen" id="screen-log-detail" hidden>
      <button class="back" data-back="logs">‹ 로그 목록</button>
      <div id="logDetail"></div>
    </section>

    <!-- Calibration -->
    <section class="screen" id="screen-cal" hidden>
      <div class="filters">
        <input id="matSearch" type="search" placeholder="재료 검색">
      </div>
      <ul class="list" id="matList"></ul>
    </section>
    <section class="screen" id="screen-cal-detail" hidden>
      <button class="back" data-back="cal">‹ 재료 목록</button>
      <div id="calDetail"></div>
    </section>

    <!-- Settings -->
    <section class="screen" id="screen-settings" hidden>
      <div class="card">
        <h2>작성자</h2>
        <form id="authorEditForm" class="row">
          <input id="authorEdit" required>
          <button type="submit">변경</button>
        </form>
      </div>
      <div class="card">
        <h2>Dropbox 폴더</h2>
        <form id="rootForm">
          <input id="rootInput" required>
          <button type="submit">저장 후 다시 동기화</button>
        </form>
        <p class="hint">VTE_MANAGER 폴더 경로. 앱은 이 폴더 밖은 읽거나 쓰지 않아요.</p>
      </div>
      <div class="card">
        <h2>캐시</h2>
        <p id="cacheInfo"></p>
        <div class="row">
          <button id="resyncBtn">전체 다시 받기</button>
          <button id="logoutBtn" class="danger">로그아웃</button>
        </div>
      </div>
      <p class="hint center" id="versionInfo"></p>
    </section>
  </main>

  <nav class="tabbar" id="tabbar" hidden>
    <button data-tab="logs" class="active">로그</button>
    <button data-tab="cal">Calibration</button>
    <button data-tab="settings">설정</button>
  </nav>

  <script src="xlsx.full.min.js"></script>
  <script src="vte-core.js"></script>
  <script src="data.js"></script>
  <script src="dropbox.js"></script>
  <script src="store.js"></script>
  <script src="app.js"></script>
</body>
</html>
